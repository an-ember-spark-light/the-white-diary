<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1000"
     viewBox="0 0 1000 1000">

  <defs>
    <radialGradient id="gold">
      <stop offset="0%" stop-color="#fff9bd"/>
      <stop offset="35%" stop-color="#ffdc69"/>
      <stop offset="75%" stop-color="#f9a900"/>
      <stop offset="100%" stop-color="#d47b00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="whiteGold">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="40%" stop-color="#fff4b5"/>
      <stop offset="75%" stop-color="#ffc52c"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amber">
      <stop offset="0%" stop-color="#bd7b0c" stop-opacity=".65"/>
      <stop offset="65%" stop-color="#8c4b00" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#613000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="brown">
      <stop offset="0%" stop-color="#68400a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#301800" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <filter id="heavyBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="scrimBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1000" height="1000" fill="#030201"/>

  <!-- Large diffuse background bokeh -->
  <g filter="url(#heavyBlur)">
    <circle cx="220" cy="260" r="110" fill="url(#brown)"/>
    <circle cx="450" cy="160" r="100" fill="url(#amber)"/>
    <circle cx="730" cy="240" r="120" fill="url(#brown)"/>
    <circle cx="850" cy="670" r="110" fill="url(#amber)"/>
    <circle cx="160" cy="660" r="100" fill="url(#amber)"/>
    <circle cx="500" cy="520" r="140" fill="url(#brown)"/>
    <circle cx="600" cy="100" r="75" fill="url(#amber)"/>
  </g>

  <!-- Soft amber and brown circles -->
  <g filter="url(#soft)">
    <circle cx="150" cy="150" r="42" fill="url(#amber)"/>
    <circle cx="315" cy="140" r="75" fill="url(#brown)"/>
    <circle cx="440" cy="180" r="38" fill="url(#amber)"/>
    <circle cx="550" cy="105" r="45" fill="url(#gold)"/>
    <circle cx="640" cy="300" r="70" fill="url(#amber)"/>
    <circle cx="780" cy="190" r="48" fill="url(#brown)"/>
    <circle cx="900" cy="320" r="38" fill="url(#amber)"/>
    <circle cx="100" cy="610" r="65" fill="url(#amber)"/>
    <circle cx="300" cy="550" r="60" fill="url(#gold)"/>
    <circle cx="520" cy="570" r="50" fill="url(#amber)"/>
    <circle cx="750" cy="560" r="80" fill="url(#brown)"/>
    <circle cx="370" cy="770" r="45" fill="url(#gold)"/>
  </g>

  <!-- Medium golden bokeh -->
  <g filter="url(#glow)">
    <circle cx="150" cy="145" r="22" fill="url(#whiteGold)"/>
    <circle cx="315" cy="140" r="16" fill="url(#gold)"/>
    <circle cx="445" cy="230" r="30" fill="url(#gold)"/>
    <circle cx="550" cy="100" r="43" fill="url(#gold)"/>
    <circle cx="565" cy="185" r="28" fill="url(#gold)"/>
    <circle cx="650" cy="320" r="48" fill="url(#gold)"/>
    <circle cx="745" cy="310" r="40" fill="url(#whiteGold)"/>
    <circle cx="820" cy="390" r="29" fill="url(#gold)"/>
    <circle cx="880" cy="260" r="23" fill="url(#gold)"/>
    <circle cx="930" cy="250" r="20" fill="url(#gold)"/>
    <circle cx="110" cy="430" r="22" fill="url(#gold)"/>
    <circle cx="190" cy="510" r="42" fill="url(#whiteGold)"/>
    <circle cx="305" cy="520" r="50" fill="url(#gold)"/>
    <circle cx="530" cy="530" r="39" fill="url(#gold)"/>
    <circle cx="640" cy="650" r="30" fill="url(#gold)"/>
    <circle cx="730" cy="790" r="27" fill="url(#whiteGold)"/>
    <circle cx="365" cy="770" r="38" fill="url(#gold)"/>
    <circle cx="180" cy="760" r="32" fill="url(#gold)"/>
    <circle cx="80" cy="770" r="27" fill="url(#gold)"/>
  </g>

  <!-- Bright foreground bokeh -->
  <g>
    <circle cx="150" cy="145" r="21" fill="#ffb51d"/>
    <circle cx="285" cy="265" r="10" fill="#ffd65b"/>
    <circle cx="480" cy="245" r="20" fill="#ffd75b"/>
    <circle cx="565" cy="105" r="30" fill="#ffbd37" opacity=".85"/>
    <circle cx="575" cy="190" r="19" fill="#ffd35b" opacity=".8"/>
    <circle cx="600" cy="365" r="23" fill="#fff0ae" opacity=".85"/>
    <circle cx="735" cy="320" r="29" fill="#fff0b1"/>
    <circle cx="675" cy="390" r="25" fill="#fff0b1"/>
    <circle cx="710" cy="415" r="17" fill="#ffe37a"/>
    <circle cx="735" cy="430" r="16" fill="#ffdf69"/>
    <circle cx="750" cy="450" r="9" fill="#ffc62c"/>
    <circle cx="860" cy="505" r="20" fill="#ffc13a"/>

    <circle cx="105" cy="430" r="19" fill="#bd791e" opacity=".7"/>
    <circle cx="155" cy="455" r="17" fill="#ffb92d" opacity=".8"/>
    <circle cx="190" cy="510" r="30" fill="#fff4c6"/>
    <circle cx="220" cy="585" r="19" fill="#ffbf35"/>
    <circle cx="185" cy="650" r="19" fill="#ffb525"/>
    <circle cx="245" cy="700" r="27" fill="#ffcc60" opacity=".8"/>
    <circle cx="330" cy="715" r="21" fill="#fff0a6"/>
    <circle cx="310" cy="730" r="10" fill="#ffb72e"/>
    <circle cx="375" cy="710" r="34" fill="#ffc35b" opacity=".8"/>

    <circle cx="330" cy="525" r="23" fill="#fff0ac"/>
    <circle cx="265" cy="675" r="18" fill="#e5a22c" opacity=".8"/>
    <circle cx="530" cy="580" r="19" fill="#bd791e" opacity=".7"/>
    <circle cx="615" cy="660" r="19" fill="#fff0a5"/>
    <circle cx="650" cy="690" r="22" fill="#e8a83c" opacity=".8"/>
    <circle cx="710" cy="790" r="25" fill="#ffc53b"/>
    <circle cx="480" cy="850" r="20" fill="#ffc34a"/>

    <circle cx="775" cy="145" r="19" fill="#d88a18" opacity=".7"/>
    <circle cx="785" cy="190" r="16" fill="#c58b2d" opacity=".65"/>
    <circle cx="875" cy="230" r="19" fill="#d59a3a" opacity=".65"/>
    <circle cx="935" cy="210" r="20" fill="#dca13e" opacity=".75"/>
    <circle cx="975" cy="380" r="27" fill="#bb842b" opacity=".55"/>
    <circle cx="820" cy="720" r="10" fill="#fff3a1"/>
    <circle cx="870" cy="750" r="17" fill="#8e4c0d" opacity=".6"/>
  </g>

  <!-- Small scattered light particles -->
  <g fill="#e99c18">
    <circle cx="165" cy="355" r="18" opacity=".35"/>
    <circle cx="315" cy="120" r="13" opacity=".4"/>
    <circle cx="470" cy="110" r="30" opacity=".12"/>
    <circle cx="510" cy="400" r="20" opacity=".2"/>
    <circle cx="625" cy="530" r="30" opacity=".4"/>
    <circle cx="750" cy="570" r="14" opacity=".5"/>
    <circle cx="835" cy="420" r="12" opacity=".35"/>
    <circle cx="915" cy="620" r="9" opacity=".3"/>
    <circle cx="130" cy="700" r="28" opacity=".25"/>
    <circle cx="230" cy="825" r="10" opacity=".4"/>
    <circle cx="520" cy="740" r="22" opacity=".15"/>
  </g>

  <!-- Dark backdrop behind text for readability -->
  <rect x="120" y="270" width="760" height="460" rx="40"
        fill="#030201" opacity="0.6" filter="url(#scrimBlur)"/>

  <!-- Text (left-aligned, vertically centered) -->
  <g font-family="Georgia, 'Times New Roman', serif"
     font-size="26" fill="#fff4d2" filter="url(#textShadow)">

    <!-- Paragraph 1 -->
    <text x="170" y="320">All these little specks of moments when we made</text>
    <text x="170" y="360">others smile, cared for the well-being of our</text>
    <text x="170" y="400">loved ones... when we made strangers stop and</text>
    <text x="170" y="440">admire us... helped many feel reassured...</text>

    <!-- Paragraph 2 -->
    <text x="170" y="508">throughout the years, across multiple phases of</text>
    <text x="170" y="548">life, impacting a rather large number of people...</text>
    <text x="170" y="588">actually making a change...</text>

    <!-- Paragraph 3 -->
    <text x="170" y="656" font-style="italic">I just wonder...</text>
    <text x="170" y="700" font-size="32" font-weight="bold" fill="#ffd65b">What's all this for?</text>
  </g>

</svg>