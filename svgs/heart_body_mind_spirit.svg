<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Four stadium (pill) shapes, each 280 wide (r=140), rotated 45 degrees -->
    <rect id="shapeA" x="-307" y="-140" width="614" height="280" rx="140" ry="140" transform="translate(474,408) rotate(45)"/>
    <rect id="shapeB" x="-310" y="-140" width="620" height="280" rx="140" ry="140" transform="translate(570,308) rotate(45)"/>
    <rect id="shapeC" x="-310" y="-140" width="620" height="280" rx="140" ry="140" transform="translate(614,308) rotate(-45)"/>
    <rect id="shapeD" x="-307" y="-140" width="614" height="280" rx="140" ry="140" transform="translate(710,408) rotate(-45)"/>
    <clipPath id="clipA"><use href="#shapeA" xlink:href="#shapeA"/></clipPath>
    <clipPath id="clipB"><use href="#shapeB" xlink:href="#shapeB"/></clipPath>
    <clipPath id="clipC"><use href="#shapeC" xlink:href="#shapeC"/></clipPath>
    <clipPath id="clipD"><use href="#shapeD" xlink:href="#shapeD"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Opaque region fills, painted from singles up to ABCD, using exact colors sampled from the original -->
  <g transform="translate(500,500) scale(1.15) translate(-592,-357)">
  <!-- A --><use href="#shapeA" xlink:href="#shapeA" fill="#d0ddef"/>
  <!-- B --><use href="#shapeB" xlink:href="#shapeB" fill="#ffefbe"/>
  <!-- C --><use href="#shapeC" xlink:href="#shapeC" fill="#ddead1"/>
  <!-- D --><use href="#shapeD" xlink:href="#shapeD" fill="#eebfbf"/>
  <!-- AB --><g clip-path="url(#clipA)"><use href="#shapeB" xlink:href="#shapeB" fill="#dbd5b2"/></g>
  <!-- AC --><g clip-path="url(#clipA)"><use href="#shapeC" xlink:href="#shapeC" fill="#bad0c6"/></g>
  <!-- AD --><g clip-path="url(#clipA)"><use href="#shapeD" xlink:href="#shapeD" fill="#c4acc0"/></g>
  <!-- BC --><g clip-path="url(#clipB)"><use href="#shapeC" xlink:href="#shapeC" fill="#dbdea2"/></g>
  <!-- BD --><g clip-path="url(#clipB)"><use href="#shapeD" xlink:href="#shapeD" fill="#f3c08f"/></g>
  <!-- CD --><g clip-path="url(#clipC)"><use href="#shapeD" xlink:href="#shapeD" fill="#ceb9a0"/></g>
  <!-- ABC --><g clip-path="url(#clipA)"><g clip-path="url(#clipB)"><use href="#shapeC" xlink:href="#shapeC" fill="#c1cb9a"/></g></g>
  <!-- ABD --><g clip-path="url(#clipA)"><g clip-path="url(#clipB)"><use href="#shapeD" xlink:href="#shapeD" fill="#d4b090"/></g></g>
  <!-- ACD --><g clip-path="url(#clipA)"><g clip-path="url(#clipC)"><use href="#shapeD" xlink:href="#shapeD" fill="#b0ada2"/></g></g>
  <!-- BCD --><g clip-path="url(#clipB)"><g clip-path="url(#clipC)"><use href="#shapeD" xlink:href="#shapeD" fill="#d3bb7d"/></g></g>
  <!-- ABCD --><g clip-path="url(#clipA)"><g clip-path="url(#clipB)"><g clip-path="url(#clipC)"><use href="#shapeD" xlink:href="#shapeD" fill="#bab07d"/></g></g></g>

  <!-- Outlines on top -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.2">
    <use href="#shapeA" xlink:href="#shapeA"/>
    <use href="#shapeB" xlink:href="#shapeB"/>
    <use href="#shapeC" xlink:href="#shapeC"/>
    <use href="#shapeD" xlink:href="#shapeD"/>
  </g>

  <!-- Region labels -->
  <g font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" font-weight="bold" fill="#000" text-anchor="middle">
    <text x="469" y="125">Body</text>
    <text x="705" y="125">Mind</text>
    <text x="391" y="235">Energy</text>
    <text x="592" y="235">Belief</text>
    <text x="788" y="235">Subconscious</text>
    <text x="295" y="333">Heart</text>
    <text x="489" y="333">Goodwill</text>
    <text x="694" y="333">Peace</text>
    <text x="879" y="333">Spirit</text>
    <text x="413" y="443">Morals</text>
    <text x="592" y="437">You</text>
    <text x="771" y="443">Life</text>
    <text x="510" y="523">Intention</text>
    <text x="672" y="523">Faith</text>
    <text x="592" y="610">Love</text>
    </g>
  </g>
</svg>
