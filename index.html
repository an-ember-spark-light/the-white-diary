<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A rather lovely life</title>


<link rel="stylesheet" href="colours.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>

* { box-sizing: border-box; }

html { background: #000; }

body {
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", "Segoe UI", Arial, sans-serif;

    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #eef2f6;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

.scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: #000;
    overflow: hidden;
}
.scene svg {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.page {
    position: relative;
    z-index: 2;
    max-width: 1500px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 84px) clamp(16px, 3.5vw, 56px) 160px;
}

.masthead {
    text-align: center;
    margin-bottom: clamp(40px, 7vw, 96px);
}

.masthead h1 {
    margin: 0;
    font-family: var(--serif);
    font-variation-settings: "opsz" 144;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2.4rem, 6vw, 4.6rem);
    letter-spacing: -0.02em;
    color: #f4ece6;
    text-shadow: 0 0 40px rgba(90, 120, 200, 0.5);
}

.masthead p {
    margin: 14px 0 0;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    color: rgba(235, 228, 240, 0.65);
}

#quotes-container {
    column-count: 4;
    column-gap: clamp(14px, 1.6vw, 26px);
}

.quote-card {
    --c: #ddd;
    break-inside: avoid;
    display: block;
    width: 100%;
    min-width: 0;
    margin: 0 0 clamp(14px, 1.6vw, 26px);
    padding: clamp(22px, 2.2vw, 34px) clamp(20px, 2vw, 30px) clamp(16px, 1.6vw, 22px);
    position: relative;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;

    border: 1px solid color-mix(in srgb, var(--c) 20%, transparent);
    border-radius: 22px;
    background:
        radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--c) 13%, transparent), transparent 70%),
        rgba(4, 6, 18, 0.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
}

.quote-card:hover,
.quote-card:focus-visible {
    border-color: color-mix(in srgb, var(--c) 55%, transparent);
    outline: none;
}

.quote-card:focus-visible { outline: 2px solid color-mix(in srgb, var(--c) 70%, #fff); outline-offset: 3px; }


.quote-text,
.reader blockquote {
    font-family: var(--serif);
    font-optical-sizing: none;
    font-variation-settings: "opsz" 36, "wght" 350;
    font-weight: 350;
    font-synthesis: none;
    letter-spacing: -0.005em;
}

.quote-text {
    margin: 0;
    font-family: var(--serif);
    font-variation-settings: "opsz" 36;
    font-weight: 350;
    font-size: var(--quote-size, 1.15rem);
    line-height: 1.6;
    letter-spacing: -0.005em;
    color: color-mix(in srgb, var(--c) 18%, #fff);
    white-space: pre-line;
}

.quote-footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-top: 26px;
    font-size: 0.74rem;
    color: color-mix(in srgb, var(--c) 55%, #fff);
    opacity: 0.8;
}

.quote-color { display: inline-flex; align-items: center; gap: 8px; }
.quote-color::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--c);
}
.quote-date { white-space: nowrap; }

.status-message {
    column-span: all;
    text-align: center;
    padding: 60px 15px;
    color: rgba(235, 228, 240, 0.7);
}

.reader {
    --rc: #ddd;
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    place-items: center;
    padding: clamp(24px, 6vw, 90px);
    background:
        radial-gradient(90% 70% at 50% 40%, color-mix(in srgb, var(--rc) 14%, transparent), transparent 75%),
        rgba(2, 3, 12, 0.9);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
}

.reader.open { display: grid; }

.reader figure { margin: 0; max-width: 34em; }

.reader blockquote {
    margin: 0;
    font-family: var(--serif);
    font-variation-settings: "opsz" 144;
    font-weight: 300;
    font-size: clamp(1.5rem, 3.6vw, 2.9rem);
    line-height: 1.5;
    letter-spacing: -0.015em;
    color: color-mix(in srgb, var(--rc) 20%, #fff);
    white-space: pre-line;
}

.reader figcaption {
    display: flex;
    gap: 18px;
    margin-top: clamp(28px, 4vw, 48px);
    font-size: 0.85rem;
    color: color-mix(in srgb, var(--rc) 55%, #fff);
    opacity: 0.85;
}

.reader button {
    position: absolute;
    border: 0;
    background: none;
    cursor: pointer;
    color: color-mix(in srgb, var(--rc) 45%, #fff);
    font: 500 0.85rem var(--sans);
    padding: 14px 18px;
    border-radius: 999px;
    opacity: 0.7;
}
.reader button:hover,
.reader button:focus-visible { opacity: 1; background: color-mix(in srgb, var(--rc) 14%, transparent); outline: none; }

.reader .close { top: max(18px, env(safe-area-inset-top)); right: 18px; }
.reader .prev  { left: 14px;  top: 50%; transform: translateY(-50%); font-size: 1.4rem; }
.reader .next  { right: 14px; top: 50%; transform: translateY(-50%); font-size: 1.4rem; }


@media (max-width: 1200px) { #quotes-container { column-count: 3; } }
@media (max-width: 800px)  { #quotes-container { column-count: 2; } }
@media (max-width: 540px) {
    #quotes-container { column-count: 1; }
    .reader .prev, .reader .next { top: auto; bottom: 22px; transform: none; }
}

/* =========================================
   SECOND SECTION — SVG GALLERY
========================================= */

.svg-section {
    margin-top: clamp(90px, 12vw, 160px);
}

#svg-container {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(14px, 1.6vw, 26px);
    align-items: stretch;
}

.svg-card {
    appearance: none;
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    min-width: 0;
    padding: clamp(12px, 1.5vw, 22px);
    overflow: hidden;
    cursor: pointer;

    border: 1px solid rgba(210, 205, 230, 0.18);
    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(30, 35, 58, 0.35),
            rgba(4, 6, 18, 0.65)
        );

    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);

    transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease;
}

.svg-card:hover,
.svg-card:focus-visible {
    border-color: rgba(210, 205, 230, 0.55);
    background: rgba(20, 24, 42, 0.75);
    outline: none;
}

.svg-card:hover {
    transform: translateY(-3px);
}

.svg-card:focus-visible {
    outline: 2px solid rgba(220, 210, 245, 0.75);
    outline-offset: 3px;
}

.svg-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* =========================================
   ENLARGED SVG READER
========================================= */

.svg-reader {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: none;
    place-items: center;

    padding: clamp(55px, 8vw, 100px);

    background: rgba(2, 3, 12, 0.94);

    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
}

.svg-reader.open {
    display: grid;
}

.svg-reader img {
    display: block;

    width: min(72vw, 760px);
    height: min(72vw, 760px);

    max-width: 76vh;
    max-height: 76vh;

    object-fit: contain;
}

.svg-reader button {
    position: absolute;
    z-index: 2;

    border: 0;
    background: none;
    cursor: pointer;

    color: rgba(235, 228, 240, 0.8);
    font: 500 0.85rem var(--sans);

    padding: 14px 18px;
    border-radius: 999px;

    opacity: 0.75;
}

.svg-reader button:hover,
.svg-reader button:focus-visible {
    opacity: 1;
    background: rgba(220, 210, 245, 0.12);
    outline: none;
}

.svg-reader .svg-close {
    top: max(18px, env(safe-area-inset-top));
    right: 18px;
}

.svg-reader .svg-prev {
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
}

.svg-reader .svg-next {
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
}

/* =========================================
   RESPONSIVE GRID
========================================= */

@media (max-width: 1200px) {
    #svg-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 800px) {
    #svg-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 540px) {
    #svg-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .svg-card {
        border-radius: 16px;
        padding: 10px;
    }

    .svg-reader .svg-prev,
    .svg-reader .svg-next {
        top: auto;
        bottom: 22px;
        transform: none;
    }
}

</style>
</head>

<script>
const container = document.getElementById("quotes-container");
const body = document.body;
const reader = document.getElementById("reader");
const readerQuote = document.getElementById("reader-quote");

let quotes = [];
let colors = [];
let assigned = [];
let cards = [];
let current = -1;

function getAvailableColors() {
    const rootStyles = getComputedStyle(document.documentElement);
    const list = [];

    for (let i = 0; i < rootStyles.length; i++) {
        const prop = rootStyles[i];
        if (!prop.startsWith("--")) continue;

        const value = rootStyles.getPropertyValue(prop).trim();
        if (value && CSS.supports("color", value)) {
            list.push({
                name: prop.replace(/^--/, "").replace(/-/g, " ").replace(/\b\w/g, l => l.toUpperCase()),
                value
            });
        }
    }
    return list;
}

function assignColors(count) {
    const gap = Math.min(7, colors.length - 1);
    const out = [];

    for (let i = 0; i < count; i++) {
        const recent = out.slice(-gap).map(c => c.value);
        const pool = colors.filter(c => !recent.includes(c.value));
        out.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    return out;
}

function getFontSize(q) {
    const n = q.length;
    if (n < 60)  return "clamp(1.3rem, 1.9vw, 1.7rem)";
    if (n < 130) return "clamp(1.1rem, 1.5vw, 1.3rem)";
    if (n < 240) return "clamp(1rem, 1.25vw, 1.12rem)";
    return "clamp(0.94rem, 1.1vw, 1.02rem)";
}

function renderQuotes() {
    container.innerHTML = "";
    assigned = assignColors(quotes.length);

    cards = quotes.map((item, i) => {
        const card = document.createElement("article");
        card.className = "quote-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.style.setProperty("--c", assigned[i].value);
        card.style.setProperty("--quote-size", getFontSize(item.quote));

        const text = document.createElement("p");
        text.className = "quote-text";
        text.textContent = item.quote;

        const footer = document.createElement("div");
        footer.className = "quote-footer";

        const colorEl = document.createElement("span");
        colorEl.className = "quote-color";
        colorEl.textContent = assigned[i].name;

        const dateEl = document.createElement("span");
        dateEl.className = "quote-date";
        dateEl.textContent = item.date;

        footer.append(colorEl, dateEl);
        card.append(text, footer);

        card.addEventListener("click", () => openReader(i));
        card.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openReader(i); }
        });

        container.appendChild(card);
        return card;
    });

    document.getElementById("count").textContent =
        quotes.length + (quotes.length === 1 ? " experience" : " experiences");
}

function showInReader(i) {
    current = i;
    reader.style.setProperty("--rc", assigned[i].value);
    readerQuote.textContent = quotes[i].quote;
    document.getElementById("reader-color").textContent = assigned[i].name;
    document.getElementById("reader-date").textContent = quotes[i].date;
}

function openReader(i) {
    showInReader(i);
    reader.classList.add("open");
    body.style.overflow = "hidden";
    reader.querySelector(".close").focus({ preventScroll: true });
}

function closeReader() {
    reader.classList.remove("open");
    body.style.overflow = "";
    if (cards[current]) cards[current].focus({ preventScroll: true });
    current = -1;
}

function step(dir) {
    if (current < 0) return;
    showInReader((current + dir + quotes.length) % quotes.length);
}

reader.querySelector(".close").addEventListener("click", closeReader);
reader.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
reader.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); step(1); });
reader.addEventListener("click", e => { if (e.target === reader) closeReader(); });

document.addEventListener("keydown", e => {
    if (current < 0) return;
    if (e.key === "Escape") closeReader();
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
});

async function loadQuotes() {
    try {
        const response = await fetch("text.json");
        if (!response.ok) throw new Error("Could not load text.json (HTTP " + response.status + ").");

        const data = await response.json();

        quotes = Object.keys(data)
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
            .map(id => data[id])
            .filter(item => item && typeof item.quote === "string" && typeof item.date === "string");

        if (quotes.length === 0) throw new Error("No valid quotes found in text.json.");

        colors = getAvailableColors();
        if (colors.length < 2) throw new Error("Please define at least two valid colours in colours.css.");

        renderQuotes();

    } catch (error) {
        console.error(error);
        container.innerHTML = "";
        const message = document.createElement("p");
        message.className = "status-message";
        message.textContent = error.message;
        container.appendChild(message);
    }
}

loadQuotes();
</script>
<script>
/* =========================================
   SVG GALLERY
========================================= */

const svgContainer = document.getElementById("svg-container");

const svgReader = document.getElementById("svg-reader");
const svgReaderImage = document.getElementById("svg-reader-image");

const svgClose = svgReader.querySelector(".svg-close");
const svgPrev = svgReader.querySelector(".svg-prev");
const svgNext = svgReader.querySelector(".svg-next");

let artworks = [];
let svgCards = [];
let currentArtwork = -1;
let previousSvgFocus = null;


/* =========================================
   LOAD SVG JSON
========================================= */

async function loadSVGs() {

    try {

        const response = await fetch("svg.json");

        if (!response.ok) {
            throw new Error("Could not load svg.json");
        }

        const data = await response.json();

        artworks = Object.keys(data)
            .sort((a, b) =>
                a.localeCompare(b, undefined, { numeric: true })
            )
            .map(id => data[id])
            .filter(filename =>
                typeof filename === "string" &&
                filename.length > 0 &&
                filename.toLowerCase().endsWith(".svg") &&
                !filename.includes("/") &&
                !filename.includes("\\")
            );

        if (artworks.length === 0) {
            throw new Error("No valid SVG files found.");
        }

        renderSVGs();

    } catch (error) {

        console.error("SVG gallery error:", error);

    }

}


/* =========================================
   RENDER SVG GALLERY
========================================= */

function renderSVGs() {

    svgContainer.innerHTML = "";

    svgCards = artworks.map((filename, index) => {

        const path = "svgs/" + encodeURIComponent(filename);

        const card = document.createElement("button");

        card.type = "button";
        card.className = "svg-card";
        card.setAttribute("aria-label", "Open artwork " + (index + 1));

        const img = document.createElement("img");

        img.src = path;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";

        card.appendChild(img);

        card.addEventListener("click", () => {
            openSVGReader(index, card);
        });

        svgContainer.appendChild(card);

        return card;

    });

}


/* =========================================
   OPEN ENLARGED SVG
========================================= */

function openSVGReader(index, sourceCard) {

    currentArtwork = index;
    previousSvgFocus = sourceCard;

    showSVGArtwork(index);

    svgReader.classList.add("open");

    document.body.style.overflow = "hidden";

    svgClose.focus({ preventScroll: true });

}


function showSVGArtwork(index) {

    currentArtwork = index;

    const filename = artworks[index];

    svgReaderImage.src = "svgs/" + encodeURIComponent(filename);

}


/* =========================================
   CLOSE SVG READER
========================================= */

function closeSVGReader() {

    svgReader.classList.remove("open");

    svgReaderImage.removeAttribute("src");

    document.body.style.overflow = "";

    currentArtwork = -1;

    if (previousSvgFocus && previousSvgFocus.isConnected) {
        previousSvgFocus.focus({ preventScroll: true });
    }

    previousSvgFocus = null;

}


/* =========================================
   PREVIOUS / NEXT NAVIGATION
========================================= */

function stepSVG(direction) {

    if (currentArtwork < 0 || artworks.length === 0) return;

    const nextIndex =
        (currentArtwork + direction + artworks.length) % artworks.length;

    showSVGArtwork(nextIndex);

}


svgClose.addEventListener("click", closeSVGReader);

svgPrev.addEventListener("click", stepSVG.bind(null, -1));

svgNext.addEventListener("click", stepSVG.bind(null, 1));


/* Close when clicking outside the artwork */

svgReader.addEventListener("click", event => {

    if (event.target === svgReader) {
        closeSVGReader();
    }

});


/* =========================================
   KEYBOARD NAVIGATION
========================================= */

document.addEventListener("keydown", event => {

    if (currentArtwork < 0) return;

    if (event.key === "Escape") {
        closeSVGReader();
    }

    if (event.key === "ArrowRight") {
        stepSVG(1);
    }

    if (event.key === "ArrowLeft") {
        stepSVG(-1);
    }

});


/* =========================================
   START SVG GALLERY
========================================= */

loadSVGs();
</script>
